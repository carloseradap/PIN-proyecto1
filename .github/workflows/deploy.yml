name: CI/CD - Build, Scan, SBOM & Deploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 627131317824.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: pin-proyecto1-repo
  IMAGE_TAG: latest

jobs:
  build-secure-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Node Setup
      # -----------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build Application
        run: npm run build

      # -----------------------------
      # SNYK SECURITY SCAN
      # -----------------------------
      - name: Run Snyk Dependency Scan
        uses: snyk/actions/node@master
        with:
          command: test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # -----------------------------
      # AWS AUTH
      # -----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
          | docker login --username AWS --password-stdin $ECR_REGISTRY

      # -----------------------------
      # BUILD & PUSH
      # -----------------------------
      - name: Build Docker image
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      - name: Push image
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # -----------------------------
      # SBOM GENERATION
      # -----------------------------
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh
          sudo mv ./bin/syft /usr/local/bin/

      - name: Generate SBOM (CycloneDX)
        run: |
          syft $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -o cyclonedx-json > sbom-cyclonedx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-cyclonedx.json

      # -----------------------------
      # DEPLOY TO EC2
      # -----------------------------
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull 627131317824.dkr.ecr.us-east-1.amazonaws.com/pin-proyecto1-repo:latest

            docker stop app || true
            docker rm app || true

            docker run -d \
              --restart unless-stopped \
              --memory="256m" \
              -p 80:80 \
              --name app \
              627131317824.dkr.ecr.us-east-1.amazonaws.com/pin-proyecto1-repo:latest
