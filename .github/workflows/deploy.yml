name: CI/CD - Build and Deploy to EC2

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: pin-proyecto1-repo
  IMAGE_NAME: pin-proyecto1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # TypeScript validation
      - name: Type Check
        run: npm run typecheck

      # ESLint validation
      - name: Run ESLint
        run: npm run lint

      # Build application
      - name: Build Application
        run: npm run build

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
          | docker login --username AWS --password-stdin 627131317824.dkr.ecr.us-east-1.amazonaws.com

      # Build and tag Docker image
      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .
          docker tag $IMAGE_NAME:${{ github.sha }} \
          627131317824.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}
          docker tag $IMAGE_NAME:${{ github.sha }} \
          627131317824.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:latest

      # Push image
      - name: Push image to ECR
        run: |
          docker push 627131317824.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}
          docker push 627131317824.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:latest

      # Deploy to EC2
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull 627131317824.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:latest
            docker stop app || true
            docker rm app || true
            docker run -d \
              --restart unless-stopped \
              --memory="256m" \
              -p 80:80 \
              --name app \
              627131317824.dkr.ecr.us-east-1.amazonaws.com/$ECR_REPOSITORY:latest
